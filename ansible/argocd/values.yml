global:
  additionalLabels:
    app.kubernetes.io/part-of: argocd

server:
  extraArgs:
    - --insecure 
  resources:
    limits:
      cpu: "1000m"
      memory: "500Mi"
    requests:
      cpu: "500m"
      memory: "256Mi"

controller:
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "256Mi"

repoServer:
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

redis:
  enabled: true
  persistence:
    enabled: false  
  resources:
    limits:
      cpu: "200m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

configs:
  rbac:
    policy.default: role:admin  