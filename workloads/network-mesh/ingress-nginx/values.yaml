ingress-nginx:
  controller:
    replicaCount: 2
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
      externalTrafficPolicy: Local

    metrics:
      enabled: true

    defaultBackend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
