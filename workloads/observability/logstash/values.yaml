# Bitnami Logstash Configuration
# Refactored for Bitnami Chart compatibility

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Service exposing Beats port
service:
  type: ClusterIP
  ports:
    beats:
      port: 5044
      targetPort: 5044
      protocol: TCP

# Persistence (Optional for Logstash queues)
persistence:
  enabled: false

# Inputs
input: |
  beats {
    port => 5044
  }

# Filters
filter: |
  # Add your filters here
  # Example:
  # if [type] == "syslog" {
  #   grok {
  #     match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
  #   }
  # }

# Outputs
output: |
  elasticsearch {
    hosts => ["elasticsearch-master:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
    # Security disabled
    ssl => false
    ssl_certificate_verification => false
  }
