# Bitnami Elasticsearch Configuration
# Refactored for Bitnami Chart compatibility

global:
  kibanaEnabled: false

# Cluster Topology: Single Node (Master only)
master:
  replicas: 1
  heapSize: 1024m
  
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi

# Disable specific node roles for single-node setup
data:
  replicas: 0
coordinating:
  replicas: 0
ingest:
  replicas: 0

# Security Configuration
security:
  enabled: false # Disabling security as per previous config intent
  tls:
    enabled: false

# Extra Configuration
extraConfig:
  elasticsearch.yml: |
    # Disable xpack security features
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false

service:
  type: ClusterIP
