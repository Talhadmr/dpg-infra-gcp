# Bitnami Kibana Configuration
# Refactored for Bitnami Chart compatibility

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Elasticsearch Connection
elasticsearch:
  hosts:
    - elasticsearch-master
  port: 9200
  tls:
    enabled: false

# Usage of internal Kibana user (if security were enabled)
# serviceAccount:
#   create: true

# Extra Configuration
extraConfiguration:
  kibana.yml: |
    server.host: "0.0.0.0"
    # Disable xpack security check in Kibana
    xpack.security.enabled: false

service:
  type: ClusterIP
  port: 5601

ingress:
  enabled: false
