# External Secrets Operator Configuration

# GCP Secret Manager Configuration
# Uses VM Identity (Keyless Authentication) - no service account keys needed
gcp:
  enabled: true
  # GCP Project ID where secrets are stored
  gcpProjectId: "dpg-project-481018"

external-secrets:
  # Install CRDs
  installCRDs: true

  # Replica count
  replicaCount: 1

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  # Webhook configuration
  webhook:
    replicaCount: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 25m
        memory: 64Mi

  # Cert controller
  certController:
    replicaCount: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 25m
        memory: 64Mi

  # Service account for External Secrets Operator
  serviceAccount:
    create: true
    annotations: {}
